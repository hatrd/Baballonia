name: Release Windows
run-name: Release ${{ inputs.version || github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.1.2'
        type: string
        required: true
      notes:
        description: 'Optional release notes (otherwise generated from commits)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: windows-release-${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Resolve version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^v', '' } else { $env:REQUESTED_VERSION }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Version must use the form 1.2.3.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Initialize desktop dependency
        run: git submodule update --init src/HyperText.Avalonia

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install NSIS
        uses: negrutiu/nsis-install@v2
        with:
          arch: x64

      - name: Download verified native tools
        run: ./download_dependencies.ps1

      - name: Test Chinese resources and calibration labels
        run: dotnet test src/Baballonia.Localization.Tests/Baballonia.Localization.Tests.csproj -c Release --logger trx

      - name: Publish self-contained Windows application
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet publish src/Baballonia.Desktop/Baballonia.Desktop.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:VERSION -p:AssemblyVersion="$env:VERSION.0" -p:FileVersion="$env:VERSION.0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build installer
        working-directory: src/Baballonia.Desktop
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          makensis -V2 "-DWORKFLOW_VERSION=$env:VERSION" main.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify runtime files and create portable package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./.github/scripts/package-windows.ps1 -Version $env:VERSION -InstallerPath 'src/Baballonia.Desktop/Baballonia Setup.exe'

      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: artifacts/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Protect published releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GH_REPO']}/releases/tags/{os.environ['RELEASE_TAG']}"
          request = urllib.request.Request(url, headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  release = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          else:
              if not release['draft']:
                  raise SystemExit('This version is already published. Choose a new version.')
              if release['target_commitish'] != os.environ['RELEASE_COMMIT']:
                  raise SystemExit('The existing draft belongs to a different commit. Choose a new version.')
          PY

      - uses: actions/download-artifact@v8
        with:
          name: windows-release
          path: artifacts

      - name: Check package integrity
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS.txt

      # Keep the release private as a draft until every asset is uploaded.
      - name: Create release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Baballonia v${{ needs.build.outputs.version }}
          body: ${{ inputs.notes }}
          generate_release_notes: ${{ inputs.notes == '' }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            artifacts/Baballonia.${{ needs.build.outputs.version }}.win-x64.zip
            artifacts/Baballonia.Setup.${{ needs.build.outputs.version }}.exe
            artifacts/SHA256SUMS.txt

      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
